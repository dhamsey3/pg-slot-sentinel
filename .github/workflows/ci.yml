name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    name: Lint and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r monitor/requirements.txt
          pip install pytest boto3 flake8

      - name: Lint
        run: flake8 monitor demo

      - name: Run unit tests
        run: python -m pytest monitor/tests/ -v

  demo:
    name: Demo against real Postgres
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Start Postgres with logical replication enabled
        run: docker compose -f demo/docker-compose.yml up -d --wait

      - name: Install dependencies
        run: pip install -r demo/requirements.txt

      - name: Run the demo
        run: python demo/run_demo.py

  terraform:
    name: Terraform fmt & validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build Lambda zip (so filebase64sha256 has something real to hash)
        run: ./scripts/build_lambda.sh

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"

      - name: Terraform fmt
        working-directory: terraform
        run: terraform fmt -check -recursive

      - name: Terraform init
        working-directory: terraform
        run: terraform init -backend=false -input=false

      - name: Terraform validate
        working-directory: terraform
        run: terraform validate
